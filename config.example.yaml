# ============================================================================
# Mote 配置示例（config.example.yaml）
# ----------------------------------------------------------------------------
# 用法：复制到用户级配置路径再按需修改
#     cp config.example.yaml ~/.mote/config.yaml
#
# 配置分层加载优先级（低 -> 高，高者覆盖低者）：
#   defaults < system < user < project < workdir < profile < env < cli < programmatic < managed
#   - defaults      : pydantic 字段默认值（无文件）
#   - system        : /etc/mote/config.yaml (+ config.d/*.yaml)          —— 受信任
#   - user          : ~/.mote/config.yaml（旧名 ~/.mote/config2.yaml）    —— 受信任
#   - project       : <包目录>/config.yaml                                —— 受信任
#   - workdir       : <cwd>/.mote/config.yaml    —— 不受信任，凭据字段会被剥离
#   - profile       : ~/.mote/<name>.config.yaml（MOTE_PROFILE=name 选择）—— 受信任
#   - env           : 环境变量 MOTE_*，例:
#                     MOTE_MODELS__DEFAULT__BASE_URL=... -> models.default.base_url
#                     （__ 分隔层级；值按 YAML 解析：true / 8000 / ...）
#   - cli           : 运行时 -c key=value
#   - managed       : /etc/mote/managed.config.yaml —— 管理员策略，锁定其下所有层
#
# 唯一必填项是 `models.default`（且需可用的 api_key 或 oauth）；其余均有默认值，
# 按需取消注释覆盖即可。
# ============================================================================

# ----------------------------------------------------------------------------
# models —— 模型选择（default 必填、任务级覆盖、路由开关、api_key_helper）
# ----------------------------------------------------------------------------
models:
  # 主模型（必填）。每个请求默认走这里，除非被路由到 tasks 下的某个模型。
  default:
    # 单个 key，或一个 key 列表（在鉴权/计费失败时轮换，recovery=ROTATE_CREDENTIAL）。
    api_key: "sk-your-api-key-here"  # pragma: allowlist secret
    # 传输协议（wire）：anthropic 走原生 Messages API；其余走 OpenAI 兼容客户端。
    # 可选值：openai / anthropic / deepseek / moonshot / mistral / yi /
    #          open_router / siliconflow / fireworks / open_llm
    api_type: anthropic
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-8"
    max_token: 64000
    temperature: 0.0
    timeout: 600
    calc_usage: true          # 统计并结算 token 用量
    use_prompt_cache: true     # Anthropic 提示缓存断点（仅原生 Anthropic 路径生效）

    # —— 品牌预设（可选）——
    # 设置 provider 后，仅在你留空时用品牌目录补全 base_url + api_type，并从
    # 品牌的环境变量解析 api_key（显式值始终优先）。"auto" 让 mote 从 base_url /
    # model 名 / 环境变量中自动推断品牌。
    # 已知品牌：openai / anthropic / deepseek / moonshot / mistral / yi /
    #   open_router / siliconflow / fireworks / open_llm / groq / xai / together /
    #   nvidia / cerebras / zai / minimax / dashscope / zhipuai / stepfun /
    #   baichuan / perplexity / github-copilot
    # provider: "anthropic"

    # —— 网络代理（可选，仅此 LLM 客户端用）——
    # proxy: "http://127.0.0.1:7890"

    # —— OAuth（可选）——设置后用 OAuth token 取代静态 api_key。
    # oauth:
    #   provider: "anthropic"

  # 强制回复语言。设置后系统提示的 # Language 段要求模型始终用该语言回复，
  # 与用户输入语言无关；留空则镜像用户语言。
  response_language: "chinese"

  # 打印 api key 到 stdout 的 shell 命令（仅受信任层生效）。
  # 仅当没有静态/环境变量 key 时用于填充 default.api_key（env > 静态 > helper）。
  # api_key_helper: ""

  # 任务级模型覆盖（键为路由任务名）。默认仅 model 不同，transport/凭据继承自 default。
  # 内置任务：
  #   - compression / summary：上下文压缩与总结（默认均为 claude-sonnet-4-8）。
  #   - web_search：WebSearch 工具的二级搜索调用。默认 claude-haiku-4-5-20251001。
  #     该模型必须支持「服务端 web 搜索」（Anthropic web_search_20250305 /
  #     OpenAI Responses web_search，见 WEB_SEARCH_MODELS：opus-4 / sonnet-4 /
  #     haiku-4 / gpt-4o / gpt-4.1 / gpt-5 / o3 / o4）；否则 WebSearch 会报
  #     ToolNotConfiguredError 并提示改用 WebBrowser。
  #   - image_description：WebBrowser 读图（read_image）的二级视觉调用。默认
  #     claude-haiku-4-5-20251001。该模型必须支持图片输入（多模态 / vision）。
  # tasks:
  #   compression:
  #     model: "claude-sonnet-4-8"
  #   summary:
  #     model: "claude-sonnet-4-8"
  #   web_search:
  #     model: "claude-haiku-4-5-20251001"
  #   image_description:
  #     model: "claude-haiku-4-5-20251001"

# ----------------------------------------------------------------------------
# tools —— 工具运行时（代理 / 浏览器地区）。注意与 models.default.proxy 区分：
# 这里是给浏览器等工具用的，LLM 客户端用 models.default.proxy。
# ----------------------------------------------------------------------------
tools:
  # 全局代理（供浏览器等工具用，非 LLM）。留空则回退到环境变量 HTTP(S)_PROXY，再无则直连。
  proxy: ""
  # 浏览器地区身份（stealth 指纹用）：auto | en | zh。与代理出口 IP 地区保持一致
  #（zh-CN locale 配美国 IP 是明显的 bot 特征）。
  browser_locale: "auto"
  # 大工具结果落盘策略：单条结果超过上限时把完整输出写入会话文件，正文只留
  # <persisted-output> 预览 + 指针（模型可按需再读全文）。同时驱动 git/pytest/ruff
  # 的语义压缩。压缩子系统的这份配置会被 compaction 的 spill reducer 复用（同一实例，
  # 从 executor 借出），使工具执行期限流与历史级 spill 保持一致。
  result_limit:
    enable_tool_result_limit: true       # 总开关；false 则不限流不落盘
    persist_large_tool_results: true     # 超限时是否落盘（false 则就地头部截断）
    default_max_result_size_chars: 50000 # 单条结果字符上限（工具可各自覆盖更低/更高）
    enable_output_compression: true      # 语义压缩（git/pytest/ruff）总开关
  # 外部副作用幂等台账（EffectLedger，崩溃重放防护）。对每个 EXTERNAL 副作用工具调用
  #（网络 / 子进程 / IPC / 人机 / 派生 agent）在 tool body 执行前写 started、执行后写
  # completed/failed，随会话持久化。崩溃 resume 时对账：completed 的悬空调用用台账结果
  # 直接愈合（不重跑），started 但结果未知的注入 <unknown-after-crash> 告警。
  effect_ledger:
    enabled: true                        # false 则完全不记台账（每次调用照常直接跑）
  # Tool Search 总开关（延迟工具发现）。角色的 role_schema.deferred_tools 声明哪些工具
  # 「搜索后才可见」，此开关全局决定该声明是否生效。false 时对所有角色强制清空延迟集：
  # 不隐藏任何工具、不绑定 SearchTools、不注入紧凑菜单、不走原生 tool-search——每个声明的
  # 工具都完全可见（普通无延迟路径）。
  #
  # 注意：能否走原生 tool-search（服务端 defer_loading，缓存零击穿）取决于「模型能力」，
  # 由 supports_native_tool_search(model) 判定。只有 opus-4 / sonnet-4 / haiku-4 /
  # gpt-5.4+ 等新模型才走原生；旧模型（claude-3、gpt-4、gpt-5.0-5.3 等）即使在 native
  # 通道也只能退回客户端 withhold/reveal 路径——每次 reveal 都会把工具 schema 追加进
  # tools=，改变前缀 → 击穿 prompt 缓存（后续 system+messages 全部失效重算）。
  # 所以延迟工具功能对旧模型是「有功能但无缓存收益」，对新模型才是「功能+缓存双赢」。
  tool_search:
    enabled: true                        # false 则彻底关闭延迟工具功能

# ----------------------------------------------------------------------------
# context —— 上下文工程（压缩 / 代码地图 / 技能 / 后台流水线）
# ----------------------------------------------------------------------------
context:
  compaction:
    # 自适应压缩记忆（prompt-only）：开启后 think-engine 才会注入
    # FRC / summarize / Task Final Output 段，告知模型旧工具结果会被清理。
    enabled: false
    # FRC 段声明保留的最近消息数（与折叠实际保留数对齐）。
    protected_recent_messages: 8
  code_map:
    # 通过 LSP references 主动展示公共符号的调用方（foo called by: a.py）。
    # 需配置 LSP 层，默认关闭（会增加 LSP references 开销）。
    surface_callers: false
  skills:
    enabled: false             # P0 技能子系统总开关
    max_tokens: 2000            # 技能索引注入的 token 上限
    include_user_dir: true      # 扫描 ~/.mote/skills 的用户级技能
    include_project_dir: true   # 扫描 <dir>/.mote/skills（cwd→git-root 向上查找）
    extra_dirs: []              # 额外的最高优先级技能目录
  bggraph:
    # 启用后台节点图（pipeline）引擎，控制 pipeline 工具是否加载绑定。
    enabled: false

# ----------------------------------------------------------------------------
# workspace —— 磁盘工作区的按时清理（TTL）
# 所有会话产物都落在 ~/.mote/workspace/.agent_sessions/<session_id>/ 下：
#   rollout.jsonl（会话记录）+ blobs/ + tool_results/ + task_outputs/ + ledger/
# 清理以“会话”为原子单位，用 rollout.jsonl 的 mtime 作为存活信号，每天最多跑一次
# （由 workspace 根下的 .last_cleanup 时间戳节流），启动时后台触发、绝不删当前会话。
#
# ledger/effects.jsonl —— 外部工具副作用幂等台账（EffectLedger，崩溃重放防护）。
# 对每个 EXTERNAL 副作用工具调用（网络 / 子进程 / IPC / 人机 / 派生 agent）在 tool body
# 执行前写一条 started、执行后写 completed/failed，随会话一起持久化。进程崩溃后 resume
# 时对账：completed 的悬空调用用台账里记录的结果直接愈合（不重跑副作用），started 但结果
# 未知的调用注入 <unknown-after-crash> 告警（让模型先核验再重试）。开关在 tools.effect_ledger
# （见上文 tools 段），默认 enabled=True。
# ----------------------------------------------------------------------------
workspace:
  cleanup:
    enabled: true             # 总开关；false 则完全不清理
    # 会话级 TTL：rollout 超过该天数未动 -> 整个会话目录连同产物一并删除。
    # 0（或负数）= 永不删除会话。
    session_ttl_days: 30
    # 产物级 TTL：会话仍在存活窗口内、但超过该天数未动 -> 只清掉体积大的
    # tool_results/ 与 task_outputs/，保留 rollout.jsonl + blobs/（会话仍可回放）。
    # 0（或负数）= 永不清理产物。
    artifact_ttl_days: 7

# ----------------------------------------------------------------------------
# mcp —— MCP 主开关。服务器本身不在这里配置，而在各自的 mcp.json 声明
#（由 executor.mcp.config_source.load_mcp_servers 发现）。
# ----------------------------------------------------------------------------
mcp:
  enabled: false               # 开启后加载 mcp.json 中的全部服务器

# ----------------------------------------------------------------------------
# multimodal —— 多模态生成服务（图像 / 音频 / 音乐 / 视频）
# 仅 GenerateMedia 工具消费这些配置；未使用则可整体留空。
# 注意：GenerateMedia 生成某类媒体前会先检查对应服务是否配置（base_url + api_key
# 均非空）；未配置时直接报 ToolNotConfiguredError 并指明缺失的 multimodal.* 路径，
# 而不是等 HTTP 调用失败才报错。
# ----------------------------------------------------------------------------
multimodal:
  image_generation:
    api_key: ""
    base_url: ""
    model: "gpt-image-1.5"
  audio_generation:
    api_key: ""
    base_url: ""
    model: "eleven_v3"
  music_generation:
    api_key: ""
    base_url: ""
    model: ""
    response_format: "url"
  video_generation:
    api_key: ""
    base_url: ""
    text_to_video_model: "wan2.6-t2v"
    reference_guided_video_model: "wan2.6-i2v"

# ----------------------------------------------------------------------------
# observability —— 错误追踪（Sentry）+ LLM 链路追踪（Langfuse）。均默认关闭，
# 为可选依赖，仅在 enabled 时导入。
# ----------------------------------------------------------------------------
observability:
  sentry:
    enabled: false
    dsn: ""
    environment: "algo-debug"
    send_default_pii: true      # 是否收集 IP 等用户信息
    # extra_data: {}            # 附加到 Sentry 事件的额外字段（如 user_id、chat_id）
  langfuse:
    enabled: false
    host: "https://cloud.langfuse.com"
    public_key: ""
    secret_key: ""
    sample_rate: 1.0            # 采样率（LANGFUSE_SAMPLE_RATE）
    trace_steps: true           # 发出 think/act/tool span（第三层）

# ----------------------------------------------------------------------------
# ui —— 人机显示层（仅影响给人看的文本；模型面向文本始终为英文）
# ----------------------------------------------------------------------------
ui:
  # 显示语言：auto（从 LC_ALL/LC_MESSAGES/LANG 推断）| en | zh | ...
  language: "auto"

# ----------------------------------------------------------------------------
# secrets —— 密钥脱敏 / 保险库（默认关闭；关闭时完全不接入脱敏/上传接缝）
# ----------------------------------------------------------------------------
secrets:
  enabled: false
  # 保险库密钥/加密策略名。aes = AES-256-GCM，密钥文件 ~/.mote/vault.key。
  cipher: "aes"
  # 覆盖加密保险库文件位置（默认 ~/.mote/secrets.json）。
  # vault_path: null
  # 覆盖人工编辑的明文命名密钥文件位置（默认 ~/.mote/secrets_config.json）。
  # 扁平 {name: value} JSON，按 mtime 热同步进加密保险库。
  # secrets_config_path: null
