# ============================================================================
# Mote 配置示例（config.example.yaml）
# ----------------------------------------------------------------------------
# 用法：复制到用户级配置路径再按需修改
#     cp config.example.yaml ~/.mote/config.yaml
#
# 配置分层加载优先级（低 -> 高，高者覆盖低者）：
#   defaults < system < user < project < workdir < profile < env < cli < programmatic < managed
#   - defaults      : pydantic 字段默认值（无文件）
#   - system        : /etc/mote/config.yaml (+ config.d/*.yaml)          —— 受信任
#   - user          : ~/.mote/config.yaml                                —— 受信任
#   - project       : <包目录>/config.yaml                                —— 受信任
#   - workdir       : <cwd>/.mote/config.yaml    —— 不受信任，凭据字段会被剥离
#   - profile       : ~/.mote/<name>.config.yaml（MOTE_PROFILE=name 选择）—— 受信任
#   - env           : 环境变量 MOTE_*，例:
#                     MOTE_MODELS__DEFAULT__BASE_URL=... -> models.default.base_url
#                     （__ 分隔层级；值按 YAML 解析：true / 8000 / ...）
#   - cli           : 运行时 -c key=value
#   - managed       : /etc/mote/managed.config.yaml —— 管理员策略，锁定其下所有层
#
# 唯一必填项是 `models.default`（且需可用的 api_key 或 oauth）；其余均有默认值，
# 按需取消注释覆盖即可。
# ============================================================================

# ----------------------------------------------------------------------------
# models —— 模型选择（default 必填、任务级覆盖、路由开关、api_key_helper）
# ----------------------------------------------------------------------------
models:
  mode: shortcut
  # 主模型（必填）。每个请求默认走这里，除非被路由到 tasks 下的某个模型。
  default:
    # 单个 key，或一个 key 列表（在鉴权/计费失败时轮换，recovery=ROTATE_CREDENTIAL）。
    api_key: "sk-your-api-key-here"  # pragma: allowlist secret
    # 传输协议（wire）：anthropic 走原生 Messages API；其余走 OpenAI 兼容客户端。
    # 可选值：openai / anthropic / deepseek / moonshot / mistral / yi /
    #          open_router / siliconflow / fireworks / open_llm
    api_type: anthropic
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-8"
    max_token: 64000
    temperature: 0.0
    timeout: 600
    calc_usage: true          # 统计并结算 token 用量
    use_prompt_cache: true     # Anthropic 提示缓存断点（仅原生 Anthropic 路径生效）

    # —— 品牌预设（可选）——
    # 设置 provider 后，仅在你留空时用品牌目录补全 base_url + api_type，并从
    # 品牌的环境变量解析 api_key（显式值始终优先）。"auto" 让 mote 从 base_url /
    # model 名 / 环境变量中自动推断品牌。
    # 已知品牌：openai / anthropic / deepseek / moonshot / mistral / yi /
    #   open_router / siliconflow / fireworks / open_llm / groq / xai / together /
    #   nvidia / cerebras / zai / minimax / dashscope / zhipuai / stepfun /
    #   baichuan / perplexity / github-copilot / google / cohere / huggingface /
    #   github / heroku / nebius / ollama / ovhcloud / sambanova / vercel / litellm
    # provider: "anthropic"

    # —— 网络代理（可选，仅此 LLM 客户端用）——
    # proxy: "http://127.0.0.1:7890"

    # —— OAuth（可选）——设置后用 OAuth token 取代静态 api_key。
    # oauth:
    #   provider: "anthropic"

  # 强制回复语言。设置后系统提示的 # Language 段要求模型始终用该语言回复，
  # 与用户输入语言无关；留空则镜像用户语言。
  response_language: "chinese"

  # 输出 api key 的固定 argv helper（仅 USER/MANAGED 来源生效；不经过 shell）。
  # 仅当没有静态 key 时在 credential activation 阶段执行；普通 config load/report 不执行。
  # api_key_helper:
  #   argv: ["/absolute/path/to/helper", "--print-token"]

  # 任务级模型覆盖（键为路由任务名）。默认仅 model 不同，transport/凭据继承自 default。
  # 内置任务：
  #   - compression / summary：上下文压缩与总结（默认均为 claude-sonnet-4-8）。
  #   - web_search：WebSearch 工具的二级搜索调用。默认 claude-haiku-4-5-20251001。
  #     该模型必须支持「服务端 web 搜索」（Anthropic web_search_20250305 /
  #     OpenAI Responses web_search，见 WEB_SEARCH_MODELS：opus-4 / sonnet-4 /
  #     haiku-4 / gpt-4o / gpt-4.1 / gpt-5 / o3 / o4）；否则 WebSearch 会报
  #     ToolNotConfiguredError 并提示改用 WebBrowser。
  #   - image_description：WebBrowser 读图（read_image）的二级视觉调用。默认
  #     claude-haiku-4-5-20251001。该模型必须支持图片输入（多模态 / vision）。
  # tasks:
  #   compression:
  #     model: "claude-sonnet-4-8"
  #   summary:
  #     model: "claude-sonnet-4-8"
  #   web_search:
  #     model: "claude-haiku-4-5-20251001"
  #   image_description:
  #     model: "claude-haiku-4-5-20251001"

  # —— 显式 failover 图（可选）——
  # endpoint、候选组、task route 和恢复预算彼此独立；只有被 group 显式引用的
  # endpoint 才能参与 fallback。凭据引用在 Runtime 激活时解析，不进入 plan/event。
  # credential_pools:
  #   anthropic-main:
  #     slots:
  #       - id: anthropic-main-a
  #         secret_ref: env://ANTHROPIC_API_KEY
  #   openai-backup:
  #     slots:
  #       - id: openai-backup-a
  #         secret_ref: env://OPENAI_API_KEY
  # endpoints:
  #   primary:
  #     provider: anthropic
  #     model: "claude-sonnet-4-8"
  #     credential_pool: anthropic-main
  #     region: global
  #     governance_domain: corp-default
  #     capabilities:
  #       supports_tools: true
  #   backup:
  #     provider: openai
  #     model: "gpt-5.4"
  #     credential_pool: openai-backup
  #     region: global
  #     governance_domain: corp-default
  #     capabilities:
  #       supports_tools: true
  # failover_groups:
  #   interactive:
  #     endpoints: [primary, backup]
  #     recovery_profile: interactive
  # routes:
  #   default: interactive
  #   # 语义 route 与 task route 分开；值仍是 Gateway 的 failover group。
  #   semantic:
  #     interactive.low: interactive-low
  #     interactive.standard: interactive
  #     interactive.strong: interactive-strong
  #     interactive.max: interactive-max
  # recovery_profiles:
  #   interactive:
  #     max_wire_attempts: 4
  #     max_attempts_per_endpoint: 2
  #     max_endpoint_switches: 1
  #     max_credential_rotations: 2
  #     max_request_transforms: 2
  #     total_deadline_seconds: 300
  #     single_attempt_timeout_seconds: 120
  #     max_backoff_seconds: 20

# ----------------------------------------------------------------------------
# tools —— 工具运行时（代理 / 浏览器地区）。注意与 models.default.proxy 区分：
# 这里是给浏览器等工具用的，LLM 客户端用 models.default.proxy。
# ----------------------------------------------------------------------------
tools:
  # 全局代理（供浏览器等工具用，非 LLM）。留空则回退到环境变量 HTTP(S)_PROXY，再无则直连。
  proxy: ""
  # 浏览器地区身份（stealth 指纹用）：auto | en | zh。与代理出口 IP 地区保持一致
  #（zh-CN locale 配美国 IP 是明显的 bot 特征）。
  browser_locale: "auto"
  # 大工具结果落盘策略：单条结果超过上限时把完整输出写入会话文件，正文只留
  # <persisted-output> 预览 + 指针（模型可按需再读全文）。同时驱动 git/pytest/ruff
  # 的语义压缩。压缩子系统的这份配置会被 compaction 的 spill reducer 复用（同一实例，
  # 从 executor 借出），使工具执行期限流与历史级 spill 保持一致。
  result_limit:
    enable_tool_result_limit: true       # 总开关；false 则不限流不落盘
    persist_large_tool_results: true     # 超限时是否落盘（false 则就地头部截断）
    default_max_result_size_chars: 50000 # 单条结果字符上限（工具可各自覆盖更低/更高）
    enable_output_compression: true      # 语义压缩（git/pytest/ruff）总开关
  # Tool effect canonical store（崩溃对账边界）。
  #（网络 / 子进程 / IPC / 人机 / 派生 agent）在 tool body 执行前写 started、执行后写
  # completed/failed，随会话持久化。崩溃 resume 时对账：completed 的悬空调用用台账结果
  # 直接愈合（不重跑），started 但结果未知的注入 <unknown-after-crash> 告警。
  effect_store:
    enabled: true                        # false 则完全不记台账（每次调用照常直接跑）
  # Tool Search 总开关（延迟工具发现）。角色的 role_schema.deferred_tools 声明哪些工具
  # 「搜索后才可见」，此开关全局决定该声明是否生效。false 时对所有角色强制清空延迟集：
  # 不隐藏任何工具、不绑定 SearchTools、不注入紧凑菜单、不走原生 tool-search——每个声明的
  # 工具都完全可见（普通无延迟路径）。
  #
  # 注意：能否走原生 tool-search（服务端 defer_loading，缓存零击穿）取决于「模型能力」，
  # 由 supports_native_tool_search(model) 判定。只有 opus-4 / sonnet-4 / haiku-4 /
  # gpt-5.4+ 等新模型才走原生；旧模型（claude-3、gpt-4、gpt-5.0-5.3 等）即使在 native
  # 通道也只能退回客户端 withhold/reveal 路径——每次 reveal 都会把工具 schema 追加进
  # tools=，改变前缀 → 击穿 prompt 缓存（后续 system+messages 全部失效重算）。
  # 所以延迟工具功能对旧模型是「有功能但无缓存收益」，对新模型才是「功能+缓存双赢」。
  tool_search:
    enabled: true                        # false 则彻底关闭延迟工具功能
  # 工具调用循环护栏（loop guard）：PostToolUse 控制订阅者，与权限门、脱敏改写器同在
  # 控制平面上。盯两种「原地打转」：①重复失败——同一工具+同一参数连续失败 N 次；
  # ②无进展——某个 PURE（只读）工具连续 N 次返回完全相同的结果。命中后把一句 in-band
  # 提示追加进该次工具结果（复用 additional_context），点名具体次数并引导模型换思路
  # 或用 AskUserQuestion 转人工——只是软提示，决策仍交给模型。fail-open 且默认开启。
  loop_guard:
    enabled: true                        # false 则完全不挂载，与旧的无护栏行为逐字节一致
    failure_threshold: 3                 # 同一 (工具,参数) 连续失败多少次触发「重复失败」提示
    no_progress_threshold: 3             # 同一只读调用连续多少次返回相同结果触发「无进展」提示
  # DeviceUse 工具的可插拔设备后端（当前仅实现 Android over adb）。模型通过
  # observe/act 驱动一台设备（真机 / 模拟器 / adb connect TCP / 云手机）。
  device:
    backend: "auto"                      # auto（adb 可达则用 Android，否则空后端）| android（强制）| none（禁用）
    adb_path: "adb"                      # adb 二进制路径；裸 "adb" 走 PATH，否则填绝对路径
    serial: ""                           # 目标设备序列号（adb -s）；多设备时选一台，留空则用唯一设备
    # 无真机降级：start 探测不到任何 adb 设备时，自动拉起本地 Android 模拟器（AVD）
    # 而非直接报错。需主机装了 Android SDK 的 emulator 且已创建至少一个 AVD。
    auto_start_emulator: true            # false 则保持「必须有物理/已启动设备」的严格行为
    emulator_path: "emulator"            # emulator 二进制路径（Android SDK 的 emulator/ 目录）；裸名走 PATH
    avd_name: ""                         # 要启动的 AVD 名；留空则取 `emulator -list-avds` 的第一个
    emulator_args: []                    # 启动附加参数，如 ["-no-window"]（无头 CI）、["-no-snapshot"]
    emulator_boot_timeout: 120.0         # 等待新模拟器开机完成（sys.boot_completed）的秒数上限

# ----------------------------------------------------------------------------
# context —— 上下文工程（压缩 / 代码地图 / 技能 / 后台流水线）
# ----------------------------------------------------------------------------
context:
  compaction:
    # 自适应压缩记忆（prompt-only）：开启后 think-engine 才会注入
    # FRC / summarize / Task Final Output 段，告知模型旧工具结果会被清理。
    enabled: false
    # FRC 段声明保留的最近消息数（与折叠实际保留数对齐）。
    protected_recent_messages: 8
  code_map:
    # 通过 LSP references 主动展示公共符号的调用方（foo called by: a.py）。
    # 需配置 LSP 层，默认关闭（会增加 LSP references 开销）。
    surface_callers: false
  skills:
    enabled: false             # P0 技能子系统总开关
    max_tokens: 2000            # 技能索引注入的 token 上限
    include_user_dir: true      # 扫描 ~/.mote/skills 的用户级技能
    include_project_dir: true   # 扫描 <dir>/.mote/skills（cwd→git-root 向上查找）
    extra_dirs: []              # 额外的最高优先级技能目录
  bggraph:
    # 启用后台节点图（pipeline）引擎，控制 pipeline 工具是否加载绑定。
    enabled: false
  turn_context:
    # 每轮临时（ephemeral）上下文源的开关注册表 —— 采用 opt-out（黑名单）语义。
    # 常开源（git 状态 / token/fold 压力 / 代码地图 / 延迟工具菜单 / 时间戳 ...）
    # 默认全部启用；把某个源的 name 列进 disabled 即可屏蔽它对应的提醒块。
    # 可用 name：git / code_map / token_pressure / fold_pressure / timestamp /
    #   changed_files / tool_catalog / deferred_tool_index / skill_listing ...
    disabled: []
    # 凭据索引 —— 唯一的 opt-in 例外：一个登录填充菜单。默认关闭；开启后仅在
    # 「角色装备了 WebBrowser」且「最近一轮实际调用过 WebBrowser」时才渲染。
    # 菜单里每项是一行 `name: 要键入的值`，模型照抄进登录框；两类条目在此汇合：
    #   - 密钥占位符：name -> <agent-vault:KEY> / <secret:dotted.path>，模型键入
    #     占位符本身，工具填充时才从本地保险库展开真实值（值永不进入对话）；
    #   - 内联非密钥：直接的 name: value 明文（如用户名），模型照原样键入。
    credential_index: false
    # 密钥白名单：只暴露列出的这些密钥名（其余不进菜单）。留空=暴露全部已配置密钥。
    credential_keys: []
    # 内联非密钥键值：非敏感字段（如 username）的明文，按字面值展示供模型直接键入。
    # 不写入保险库、不脱敏 —— 仅用于你愿意放进明文 config 的非敏感项。
    credential_values: {}

# ----------------------------------------------------------------------------
# workspace —— 磁盘工作区的按时清理（TTL）
# 所有会话产物都落在 ~/.mote/workspace/.agent_sessions/<session_id>/ 下：
#   rollout.jsonl（会话记录）+ blobs/ + tool_results/ + task_outputs/ + ledger/
# 清理以“会话”为原子单位，用 rollout.jsonl 的 mtime 作为存活信号，每天最多跑一次
# （由 workspace 根下的 .last_cleanup 时间戳节流），启动时后台触发、绝不删当前会话。
#
# ledger/run-journal.jsonl —— 当前唯一运行步骤台账。
# 对每个 EXTERNAL 副作用工具调用（网络 / 子进程 / IPC / 人机 / 派生 agent）在 tool body
# 执行前写一条 started、执行后写 completed/failed，随会话一起持久化。进程崩溃后 resume
# 时对账：completed 的悬空调用用台账里记录的结果直接愈合（不重跑副作用），started 但结果
# 未知的调用注入 <unknown-after-crash> 告警（让模型先核验再重试）。开关在 tools.effect_store
# （见上文 tools 段），默认 enabled=True。
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# workflows —— Workflow 外部 effect 的可选 Temporal transport。
# ----------------------------------------------------------------------------
workflows:
  temporal_enabled: false
  temporal:
    server_address: "localhost:7233"
    namespace: "default"
    task_queue: "mote"

# ----------------------------------------------------------------------------
# resilience —— 熔断器阈值。按资源（LLM 的 api_type::model::key_index，将来 MCP /
# 出口主机）各自维护一个滑动窗口熔断器：某资源持续失败到阈值即“跳闸”，恢复循环随即
# 故障转移到健康资源；冷却后按 quorum 放行半开探针试探恢复。默认保守，仅在“持续失败”时跳闸。
# ----------------------------------------------------------------------------
resilience:
  enabled: true                 # 总开关；false 则熔断器全程 inert（永远放行、从不记录）
  window_seconds: 60.0          # 失败率统计的滑动窗口回看秒数
  min_samples: 5                # 窗口内至少这么多次结果后才检查失败率（早期单次失败不跳闸）
  error_rate_threshold: 0.5     # 失败比例达到/超过该值即跳闸（0.0–1.0）
  open_seconds: 20.0            # 跳闸后的冷却秒数
  half_open_max_probes: 1       # 半开状态下允许的并发恢复探针数
  half_open_success_quorum: 1   # 至少多少个半开探针成功后才恢复关闭态（不得超过并发探针数）
  probe_grace_seconds: 1.0      # 探针租约在所属 attempt deadline 后额外保留的秒数

# ----------------------------------------------------------------------------
# router —— 智能路由（每步选型策略 + spawn 时的初始档位）。默认全关，零行为变化：
# 不装配 ML 引擎、不做 spawn 路由，各 role 仍用固定的 models.default。
# 策略按「agent 种类」分别配置：main_agent（根/面向用户）与 sub_agent（Agent 工具
# 派生的子 agent）各自选型 —— 可只让子 agent 路由（便宜、任务级），主 agent 固定，反之亦然。
# strategy 就是路由的唯一开关：null=不路由（跑固定 models.default），任一具体策略=路由。
# （不再有单独的 per-role enable_router；是否路由完全由这里按 agent 种类决定。）
# ----------------------------------------------------------------------------
router:
  main_agent:
    strategy: null              # null（默认）= 不路由：不装策略，跑固定 models.default（零行为变化）；
                                # rule = 确定性规则策略（不加载 ML）；
                                # squilla = ML 后端策略（进程级共享 ~75MB 引擎，缺失则启发式回退）
    # default_route: interactive.standard
    # candidates: [interactive.low, interactive.standard, interactive.strong, interactive.max]
    # class_routes:              # squilla 必须显式、完整配置，候选增删不会改变 R0-R3 语义
    #   R0: interactive.low
    #   R1: interactive.standard
    #   R2: interactive.strong
    #   R3: interactive.max
    # deadline_ms: 50
  sub_agent:
    strategy: null              # 同上，作用于 Agent 工具派生的子 agent
  spawn_routing: false          # true 时子 agent spawn 用首个 prompt 定一个「初始地板」（只托底不封顶，
                                # 后续每步路由仍可升降）。需 sub_agent.strategy=squilla 才生效
  # 这里只描述 secret-free 的语义元数据；能力/治理取自 ModelGateway 的不可变 route profile。
  # routes:
  #   interactive.low: {quality_class: R0, quality_rank: 0, cost_class: low, latency_class: low}
  #   interactive.standard: {quality_class: R1, quality_rank: 1}
  #   interactive.strong: {quality_class: R2, quality_rank: 2}
  #   interactive.max: {quality_class: R3, quality_rank: 3, cost_class: high}

# ----------------------------------------------------------------------------
# mcp —— MCP 主开关。服务器本身不在这里配置，而在各自的 mcp.json 声明
#（由 executor.mcp.config_source.load_mcp_servers 发现）。
# ----------------------------------------------------------------------------
mcp:
  enabled: false               # 开启后加载 mcp.json 中的全部服务器

# ----------------------------------------------------------------------------
# multimodal —— 多模态生成服务（图像 / 音频 / 音乐 / 视频）
# 仅 GenerateMedia 工具消费这些配置；未使用则可整体留空。
# 注意：GenerateMedia 生成某类媒体前会先检查对应服务是否配置（base_url + api_key
# 均非空）；未配置时直接报 ToolNotConfiguredError 并指明缺失的 multimodal.* 路径，
# 而不是等 HTTP 调用失败才报错。
# ----------------------------------------------------------------------------
multimodal:
  image_generation:
    api_key: ""
    base_url: ""
    model: "gpt-image-1.5"
  audio_generation:
    api_key: ""
    base_url: ""
    model: "eleven_v3"
  music_generation:
    api_key: ""
    base_url: ""
    model: ""
    response_format: "url"
  video_generation:
    api_key: ""
    base_url: ""
    text_to_video_model: "wan2.6-t2v"
    reference_guided_video_model: "wan2.6-i2v"

# ----------------------------------------------------------------------------
# observability —— 错误追踪（Sentry）+ LLM 链路追踪（Langfuse）。均默认关闭，
# 为可选依赖，仅在 enabled 时导入。
# ----------------------------------------------------------------------------
observability:
  sentry:
    enabled: false
    dsn: ""
    environment: "algo-debug"
    send_default_pii: true      # 是否收集 IP 等用户信息
    # extra_data: {}            # 附加到 Sentry 事件的额外字段（如 user_id、chat_id）
  langfuse:
    enabled: false
    host: "https://cloud.langfuse.com"
    public_key: ""
    secret_key: ""
    sample_rate: 1.0            # 采样率（LANGFUSE_SAMPLE_RATE）
    trace_steps: true           # 发出 think/act/tool span（第三层）

# ----------------------------------------------------------------------------
# ui —— 人机显示层（仅影响给人看的文本；模型面向文本始终为英文）
# ----------------------------------------------------------------------------
ui:
  # 显示语言：auto（从 LC_ALL/LC_MESSAGES/LANG 推断）| en | zh | ...
  language: "auto"

# ----------------------------------------------------------------------------
# secrets —— 密钥脱敏 / 保险库（核心安全边界始终开启）
# ----------------------------------------------------------------------------
secrets:
  # 保险库密钥/加密策略名。aes = AES-256-GCM，密钥文件 ~/.mote/vault.key。
  # 覆盖加密保险库文件位置（默认 ~/.mote/secrets.json）。
  # vault_path: null
  # 覆盖人工编辑的明文命名密钥文件位置（默认 ~/.mote/secrets_config.json）。
  # 扁平 {name: value} JSON，按 mtime 热同步进加密保险库。
  # secrets_config_path: null
