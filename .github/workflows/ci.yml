name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # pre-commit hooks run as language: system, so the tools they invoke must
      # be present on PATH (isort / black / flake8 / pyright).
      - name: Install lint tooling
        run: pip install pre-commit black isort flake8 pyright==1.1.411
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Verify static type contracts
        run: python typecheck/verify_type_contract_cases.py
      - name: Verify migration diagnostic manifest
        run: python typecheck/verify_migration_diagnostics.py
      - name: Check contracts type island
        run: pyright -p typecheck/pyright.contracts.json
      - name: Check execution type island
        run: pyright -p typecheck/pyright.execution.json
      - name: Check Runtime tools type island
        run: pyright -p typecheck/pyright.runtime-tools.json
      - name: Check orchestration type island
        run: pyright -p typecheck/pyright.orchestration.json
      - name: Check presentation type island
        run: pyright -p typecheck/pyright.presentation.json

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run test suite
        run: pytest
