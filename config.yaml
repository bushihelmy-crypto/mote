# ============================================================================
# MetaGPT / AgentFrame 配置模板
# ----------------------------------------------------------------------------
# 本文件是受信任的 PROJECT 层配置（metagpt/config.yaml）。
#
# 配置加载优先级（低 -> 高，高者覆盖低者）：
#   defaults < system < user < project < workdir < profile < env < cli < programmatic < managed
#   - project  : 本文件 (metagpt/config.yaml)
#   - user     : ~/.agentframe/config.yaml  (兼容 ~/.metagpt/config2.yaml)
#   - workdir  : <cwd>/.agentframe/config.yaml  (不受信任，凭据字段会被剥离)
#   - profile  : ~/.agentframe/<name>.config.yaml  (用 AGENTFRAME_PROFILE 选择)
#   - env      : 环境变量 AGENTFRAME_* / METAGPT_*
#                例: AGENTFRAME_LLM__BASE_URL=...  ->  llm.base_url
#                    (__ 分隔层级, 值按 YAML 解析: true / 8000 / ...)
#   - cli      : 运行时 -c key=value 覆盖
#   - managed  : /etc/agentframe/managed.config.yaml  (管理员策略，覆盖一切)
#
# 只有 `llm` 是必填项；其余均有默认值，按需取消注释覆盖。
# ============================================================================

# ----------------------------------------------------------------------------
# LLM —— 主模型（必填）
# ----------------------------------------------------------------------------
llm:
  api_key: sk-QrZIL3AjCXlSMmjM5bH8q7UY7lsebiTpZttRx3eEhtxJs7TO
  api_type: anthropic
  base_url: https://newapi.deepwisdom.ai
  model: "claude-opus-4-6"
  max_token: 64000
  temperature: 0.01
  top_p: 1.0
  timeout: 600
  calc_usage: true

# ----------------------------------------------------------------------------
# 路由与任务级模型
# ----------------------------------------------------------------------------
# 智能路由：true 时按请求从注册的 model cards 选模型；false 用上面固定的 llm
enable_router: false

# 上下文压缩模型（autocompact）。默认仅 model 不同，transport/凭据继承自 llm
# compress_llm:
#   model: "claude-sonnet-4-8"

# 会话结束总结模型。默认仅 model 不同，transport/凭据继承自 llm
# summary_llm:
#   model: "claude-sonnet-4-8"

# ----------------------------------------------------------------------------
# 杂项
# ----------------------------------------------------------------------------
# 全局代理（供浏览器等工具用，非 LLM）。WebBrowser 会用它给整个会话一个出口 IP。
# 格式：http://host:port | http://user:pass@host:port | socks5://host:port
# （裸 host:port 按 http 处理）。留空则回退到环境变量 HTTP(S)_PROXY，再无则直连。
# 换出口 IP 是最有效的反封锁手段（限流/验证码按 IP 信誉触发）；请让代理所在地区
# 与下面的 browser_locale/时区一致，否则「zh-CN locale + 美国 IP」本身就是机器人特征。
proxy: "http://192.168.88.121:7890"

# 浏览器地区身份（stealth 指纹用）：auto（按主机 env 猜）| en（en-US/纽约）| zh（zh-CN/上海）。
# 已按当前代理出口在国内配成 zh，使 locale+时区+Accept-Language 与出口 IP 一致。
browser_locale: "zh"
# api_key_helper: ""                     # 打印 api key 到 stdout 的 shell 命令（仅受信任层生效）
# repair_llm_output: false               # 修复 LLM 原始输出

# ----------------------------------------------------------------------------
# 经验池 (Experience Pool)
# ----------------------------------------------------------------------------
# exp_pool:
#   enabled: false
#   enable_read: false
#   enable_write: false
#   persist_path: ".chroma_exp_data"
#   retrieval_type: "bm25"               # bm25 | chroma
#   use_llm_ranker: true
#   collection_name: "experience_pool"

# ----------------------------------------------------------------------------
# RoleZero
# ----------------------------------------------------------------------------
# role_zero:
#   # 长期记忆
#   enable_longterm_memory: false
#   longterm_memory_persist_path: ".role_memory_data"
#   memory_k: 30                         # 短期记忆容量
#   similarity_top_k: 5                  # 检索的长期记忆条数
#   use_llm_ranker: false
#
#   # 自适应压缩记忆（prompt-only：开关后 think-engine 发 compaction 段，实际清理由 context.compaction 执行）
#   enable_compressable_memory: false
#   protected_recent_messages: 8         # FRC 段声明保留的最新消息数
#
#   # P0 Skills
role_zero:
  skills:
    enabled: true
    max_tokens: 2000

