[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mote"
version = "2.0.0"
description = "A composable, event-driven, layered agent runtime framework (think/act ReAct loop, multi-agent runtime, unified LLM routing, permission sandbox)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "zthird_party_licenses/*"]
authors = [{ name = "mote contributors" }]
keywords = ["agent", "llm", "react", "framework", "multi-agent", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Core runtime
    "pydantic>=2",
    "PyYAML",
    "loguru",
    "tenacity",
    "filelock",
    "chardet",
    "json-repair",
    "asteval",  # sandboxed expression eval for run_graph compute nodes
    "cryptography",
    "keyring",
    # Async / HTTP
    "anyio",
    "aiofiles",
    "aiohttp",
    "httpx",
    "httpx-sse",
    "requests",
    "requests-unixsocket",
    # LLM providers & protocols
    "openai",
    "anthropic",
    "tiktoken",
    "mcp",
    "fastmcp",
    # Terminal UI
    "rich",
    "textual",
    "pyte>=0.8.2,<1",
    # Tokenizers / ML routing
    "numpy",
    "scikit-learn",
    "lightgbm",
    "joblib",
    "onnxruntime",
    "sentence-transformers",
    "tokenizers",
    # Browser tool
    "playwright",
    # Notebook / Python tool
    "jupyter-client",
    # Media pipeline (documents, images, PDFs)
    "pillow",
    "python-docx",
    "openpyxl",
    "pypdf",
    "PyPDF2",
    "PyMuPDF",
    "pdfminer.six",
    "markdownify",
    "pylatexenc",  # flatten LaTeX math ($…$/$$…$$) to Unicode for terminal render
    # Multi-language CodeMap (JS/TS/Go/Rust/Java/C#/C/C++ via tree-sitter). Keep
    # the Python binding and precompiled grammars as one validated native pair.
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.12.5",
    # Observability
    "langfuse",
    "sentry-sdk",
    # Linux-only seccomp hardening for the sandbox
    "pyseccomp; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "flake8", "pyright==1.1.411", "pre-commit"]
# Tier 2 durable execution (opt-in). The core never imports ``temporalio``; only
# ``DurableConfig.backend="temporal"`` selects the optional ``durable_exec/temporal``
# package, which requires this extra. Its pydantic data converter reuses mote's
# existing pydantic dep (no custom converter).
temporal = ["temporalio>=1.7"]
inference-shared = ["grpcio>=1.74,<2"]
inference-postgres = ["asyncpg>=0.30,<1"]
inference-wasm = ["wasmtime>=36,<40"]
inference-redis = ["redis>=5,<7"]
inference-qdrant = ["qdrant-client>=1.18.0,<2"]
inference-s3 = ["aioboto3>=13,<16"]
inference-gcs = ["google-cloud-storage>=3,<4"]
inference-webrtc = ["aiortc>=1.13,<2"]

[project.scripts]
mote = "mote.product.entrypoints.cli.__main__:main"

[tool.setuptools]
# packages / package-dir are computed imperatively in setup.py so the current
# directory is exposed as the top-level ``mote`` package (see setup.py).

[tool.pytest.ini_options]
testpaths = ["ztest"]
# ztest/prompts collects under its own import path (not the mote package) and
# fails to import; it is unrelated to application code, so skip it.
addopts = "-q --ignore=ztest/prompts"
