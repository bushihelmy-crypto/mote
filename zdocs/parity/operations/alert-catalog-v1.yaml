schema_version: 1
revision: alert-catalog-v1
signal_planes: [caller, daemon, correlated]
alerts:
  - {id: queue_saturation, severity: page, signal: inference_queue_utilization, signal_plane: daemon, condition: "value >= 0.90", for: PT5M, scope: generation_provider, user_impact: admission_delayed_or_rejected, automatic_action: reject_over_capacity, runbook: shared-daemon-runbook.md, owner: inference_runtime, dedupe_key: generation_provider, recovery_condition: "value < 0.70 for PT10M"}
  - {id: dispatch_event_loop_lag, severity: page, signal: inference_event_loop_lag_seconds, signal_plane: daemon, condition: "value >= 0.5", for: PT2M, scope: daemon_incarnation, user_impact: dispatch_and_stream_latency, automatic_action: close_new_admission_if_sustained, runbook: shared-daemon-runbook.md, owner: daemon_operations, dedupe_key: daemon_incarnation, recovery_condition: "value < 0.1 for PT10M"}
  - {id: provider_breaker_open, severity: ticket, signal: provider_breaker_open, signal_plane: caller, condition: "value == 1", for: PT5M, scope: provider_region_operation, user_impact: scoped_provider_unavailable, automatic_action: journaled_policy_failover_only, runbook: provider-degradation-runbook.md, owner: provider_operations, dedupe_key: provider_region_operation, recovery_condition: "value == 0 for PT10M"}
  - {id: credential_quarantined, severity: page, signal: credential_quarantined_bindings, signal_plane: caller, condition: "value > 0", for: PT1M, scope: credential_slot_revision, user_impact: affected_binding_rejected, automatic_action: quarantine_immutable_binding, runbook: credential-runbook.md, owner: security_operations, dedupe_key: credential_slot_revision, recovery_condition: healthy_revision_activated}
  - {id: usage_ledger_unavailable, severity: page, signal: usage_ledger_hard_failures, signal_plane: daemon, condition: "increase > 0", for: PT0S, scope: ledger_authority, user_impact: budgeted_requests_rejected, automatic_action: fail_closed_budgeted_requests, runbook: storage-runbook.md, owner: inference_storage, dedupe_key: ledger_authority, recovery_condition: ledger_reconciled_and_ready}
  - {id: receipt_in_doubt_age, severity: page, signal: oldest_in_doubt_seconds, signal_plane: correlated, condition: "value > reconciliation_oldest_age_slo", for: PT5M, scope: tenant_generation, user_impact: completion_unknown, automatic_action: start_bounded_evidence_collection, runbook: reconciliation-runbook.md, owner: reconciliation_operations, dedupe_key: tenant_generation, recovery_condition: "value <= reconciliation_oldest_age_slo"}
  - {id: outbox_backlog_age, severity: page, signal: oldest_outbox_seconds, signal_plane: daemon, condition: "value > outbox_age_slo", for: PT5M, scope: receipt_authority, user_impact: lifecycle_events_delayed, automatic_action: start_outbox_replay, runbook: storage-runbook.md, owner: inference_storage, dedupe_key: receipt_authority, recovery_condition: outbox_backlog_zero}
  - {id: reconciliation_backlog, severity: page, signal: reconciliation_backlog, signal_plane: correlated, condition: "value > reconciliation_backlog_slo", for: PT5M, scope: tenant_generation, user_impact: unresolved_external_effects, automatic_action: continue_bounded_reconciliation, runbook: reconciliation-runbook.md, owner: reconciliation_operations, dedupe_key: tenant_generation, recovery_condition: "value <= reconciliation_backlog_slo"}
  - {id: artifact_publication_failed, severity: page, signal: artifact_publication_failures, signal_plane: daemon, condition: "increase > 0", for: PT0S, scope: artifact_authority, user_impact: terminal_result_not_publishable, automatic_action: retain_outbox_and_block_terminal_reference, runbook: storage-runbook.md, owner: artifact_operations, dedupe_key: artifact_authority, recovery_condition: publication_outbox_drained}
  - {id: artifact_gc_blocked, severity: ticket, signal: artifact_gc_oldest_candidate_seconds, signal_plane: daemon, condition: "value > artifact_gc_age_slo", for: PT30M, scope: artifact_authority, user_impact: storage_growth, automatic_action: preserve_gc_roots_and_legal_holds, runbook: storage-runbook.md, owner: artifact_operations, dedupe_key: artifact_authority, recovery_condition: "value <= artifact_gc_age_slo"}
  - {id: disk_hard_watermark, severity: page, signal: inference_disk_free_bytes, signal_plane: daemon, condition: "value <= hard_min_free_bytes", for: PT0S, scope: storage_authority, user_impact: new_wire_rejected, automatic_action: close_new_wire_admission, runbook: storage-runbook.md, owner: inference_storage, dedupe_key: storage_authority, recovery_condition: "value > soft_min_free_bytes for PT10M"}
  - {id: sqlite_integrity_failed, severity: page, signal: sqlite_integrity_ready, signal_plane: daemon, condition: "value == 0", for: PT0S, scope: database_authority, user_impact: daemon_not_ready, automatic_action: preserve_original_and_fail_closed, runbook: storage-runbook.md, owner: inference_storage, dedupe_key: database_authority, recovery_condition: verified_restore_and_reconciliation}
  - {id: backup_restore_drill_failed, severity: page, signal: restore_drill_success, signal_plane: correlated, condition: "value == 0", for: PT0S, scope: backup_domain, user_impact: recovery_objective_unproven, automatic_action: block_slo_freeze, runbook: storage-runbook.md, owner: recovery_operations, dedupe_key: backup_domain, recovery_condition: signed_restore_drill_passed}
  - {id: daemon_crash_loop, severity: page, signal: daemon_restarts_per_window, signal_plane: daemon, condition: "value > restart_budget", for: PT5M, scope: socket_generation, user_impact: shared_gateway_unavailable, automatic_action: stop_restart_loop_and_preserve_evidence, runbook: shared-daemon-runbook.md, owner: daemon_operations, dedupe_key: socket_generation, recovery_condition: compatible_generation_stable_for_PT30M}
  - {id: stale_uds_discovery, severity: page, signal: stale_uds_discovery, signal_plane: caller, condition: "value == 1", for: PT1M, scope: application_runtime_directory, user_impact: callers_cannot_connect, automatic_action: supervisor_lock_probe_only, runbook: shared-daemon-runbook.md, owner: daemon_operations, dedupe_key: application_runtime_directory, recovery_condition: verified_discovery_generation_reachable}
  - {id: connection_pool_exhausted, severity: page, signal: provider_connection_pool_utilization, signal_plane: daemon, condition: "value >= 0.95", for: PT5M, scope: provider_endpoint, user_impact: scoped_wire_latency_or_rejection, automatic_action: reject_scoped_over_capacity, runbook: provider-degradation-runbook.md, owner: transport_operations, dedupe_key: provider_endpoint, recovery_condition: "value < 0.70 for PT10M"}
  - {id: audit_policy_failure, severity: page, signal: mandatory_audit_write_failures, signal_plane: correlated, condition: "increase > 0", for: PT0S, scope: audit_authority, user_impact: governed_operations_rejected, automatic_action: fail_closed_governed_operations, runbook: storage-runbook.md, owner: security_operations, dedupe_key: audit_authority, recovery_condition: audit_sink_verified_and_backlog_reconciled}
  - {id: redaction_violation, severity: page, signal: secret_redaction_violations, signal_plane: correlated, condition: "increase > 0", for: PT0S, scope: process_incarnation, user_impact: potential_secret_exposure, automatic_action: quarantine_diagnostic_artifact, runbook: credential-runbook.md, owner: security_operations, dedupe_key: process_incarnation, recovery_condition: incident_closed_and_clean_generation_active}
  - {id: plugin_isolation_failure, severity: page, signal: plugin_isolation_failures, signal_plane: caller, condition: "increase > 0", for: PT0S, scope: plugin_generation, user_impact: plugin_disabled, automatic_action: disable_affected_plugin_generation, runbook: upgrade-rollback-runbook.md, owner: plugin_operations, dedupe_key: plugin_generation, recovery_condition: verified_plugin_generation_active}
  - {id: generation_drain_stalled, severity: page, signal: generation_drain_oldest_seconds, signal_plane: correlated, condition: "value > drain_slo", for: PT5M, scope: generation_id, user_impact: upgrade_or_shutdown_blocked, automatic_action: reject_new_pins_and_preserve_resumability, runbook: upgrade-rollback-runbook.md, owner: daemon_operations, dedupe_key: generation_id, recovery_condition: pinned_execution_count_zero}
  - {id: live_certification_stale, severity: ticket, signal: provider_certification_age_seconds, signal_plane: caller, condition: "value > certification_max_age_seconds", for: PT1H, scope: provider_region_operation, user_impact: release_or_activation_blocked, automatic_action: block_profile_activation, runbook: provider-degradation-runbook.md, owner: provider_certification, dedupe_key: provider_region_operation, recovery_condition: fresh_signed_certification_accepted}
invariants: [triggerable, deduplicated, recoverable, runbook_linked, stable_metric_names, no_secret_labels]
