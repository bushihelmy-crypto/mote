openapi: 3.1.0
info: {title: Mote Inference Administration API, version: 1.0.0}
security: [{AdminBearer: []}]
paths:
  /admin/v1/providers: {get: {operationId: listProviders, x-scope: providers.read, responses: {'200': {description: Providers}}}}
  /admin/v1/credentials: {get: {operationId: listCredentialMetadata, x-scope: credentials.read_metadata, responses: {'200': {description: Redacted credential metadata}}}}
  /admin/v1/generations: {get: {operationId: listGenerations, x-scope: generations.read, responses: {'200': {description: Generations}}}}
  /admin/v1/generations/stage: {post: {operationId: stageGeneration, x-scope: generations.stage, responses: {'202': {description: Staged or rejected}}}}
  /admin/v1/readiness: {get: {operationId: readiness, x-scope: operations.read, responses: {'200': {description: Component readiness}}}}
  /admin/v1/receipts/{execution_id}:
    get:
      operationId: getReceipt
      x-scope: receipts.read
      parameters: [{name: execution_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Redacted receipt}}
  /admin/v1/reconciliation: {get: {operationId: listReconciliation, x-scope: reconciliation.read, responses: {'200': {description: Reconciliation backlog}}}}
  /admin/v1/audit: {get: {operationId: queryAudit, x-scope: audit.read, responses: {'200': {description: Redacted audit records}}}}
components:
  securitySchemes: {AdminBearer: {type: http, scheme: bearer}}
