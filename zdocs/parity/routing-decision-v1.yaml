schema_version: 1
revision: routing-decision-v1
snapshot:
  type: RoutingObservationSnapshot
  immutable: true
  fields:
    - snapshot_id
    - authority_revision
    - generation_id
    - catalog_digest
    - pricing_digest
    - quota_observations
    - health_observations
    - observed_at
    - expires_at
decision_trace:
  required_fields: [decision_id, snapshot_id, policy_revision, hard_filters, candidates, scores, selected, reasons]
  principal_redaction: required
  plan_binding: same_snapshot_id
dry_run:
  wire_requests: 0
  mutations: 0
  permit_signatures: 0
  output: decision_trace
counterfactual_evaluation:
  data_sources: [allowlisted_journal_projection, redacted_receipt_projection]
  tenant_isolation: required
  activation_requirements: [minimum_sample_size, cohort_balance, confidence_interval, signed_approval]
  override: {time_limited: true, audited: true, shadow_traffic: forbidden}
invariants:
  - existing_RoutingService_is_unique_router
  - failover_requires_new_journal_fact
  - stale_snapshot_cannot_activate_policy
  - empty_candidates_is_explicit_policy_failure
